[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic>=2.6", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "scipy>=1.11", "scikit-image>=0.22", "shapely>=2.0", "pyproj>=3.6"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "jinja2>=3.1", "playwright>=1.44"]
models = ["torch", "transformers>=4.40", "peft>=0.10", "accelerate>=0.29", "bitsandbytes>=0.43", "timm"]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["satquery*"]

[tool.setuptools.package-data]
satquery = ["agent/plans.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
